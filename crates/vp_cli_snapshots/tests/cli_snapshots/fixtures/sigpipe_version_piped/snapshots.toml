[[case]]
name = "sigpipe_version_piped_to_head"
vp = "global"
skip-platforms = ["windows"]
requires = ["bash"]
comment = "vp --version must not crash with SIGABRT (exit 134) when piped to a reader that exits early (#2661). After the SIGPIPE fix the process is killed by SIGPIPE (exit 141), the expected Unix behavior."
steps = [
  { argv = ["bash", "-c", "vp --version | head -n 1; exit ${PIPESTATUS[0]}"], tty = false },
]
